<section class="pagar">
  <header class="pagar__topo">
    <app-title titulo="Contas a pagar" subtitulo="Organize seus compromissos e evite juros por atraso." />

    <app-add-button
      #modal
      rotulo="Nova despesa"
      titulo="Nova despesa"
      textoSalvar="Salvar despesa"
      (abriu)="resetarForm()"
      (salvou)="salvar(modal)"
    >
      <div class="form" [formGroup]="form">
        <label class="campo">
          <span>Descrição</span>
          <input class="input" formControlName="descricao" placeholder="Ex.: Energia elétrica — loja" />
          @if (invalido('descricao')) { <small class="erro">Informe a descrição.</small> }
        </label>

        <label class="campo">
          <span>Conta</span>
          <select class="input" formControlName="conta">
            @for (c of contasBancarias; track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </label>

        <div class="linha">
          <label class="campo">
            <span>Tipo</span>
            <select class="input" formControlName="tipo">
              @for (t of tipos; track t) {
                <option [value]="t">{{ tipoInfo[t].rotulo }}</option>
              }
            </select>
          </label>

          <label class="campo">
            <span>Categoria</span>
            <select class="input" formControlName="categoria">
              @for (c of categorias; track c) {
                <option [value]="c">{{ categoriaInfo[c] }}</option>
              }
            </select>
          </label>
        </div>

        <div class="linha">
          <label class="campo">
            <span>Vencimento</span>
            <input class="input" type="date" formControlName="vencimento" />
            @if (invalido('vencimento')) { <small class="erro">Informe o vencimento.</small> }
          </label>

          <label class="campo">
            <span>Valor (R$)</span>
            <input class="input" type="number" step="0.01" min="0" formControlName="valor" placeholder="0,00" />
            @if (invalido('valor')) { <small class="erro">Informe um valor maior que zero.</small> }
          </label>
        </div>
      </div>
    </app-add-button>
  </header>

  <div class="pagar__cards">
    @for (card of cards(); track card.titulo) {
      <app-card [dados]="card" />
    }
  </div>

  <section class="pagar__lista">
    <app-despesa-filter [total]="lista().length" [(periodo)]="periodo" [(filtros)]="filtros" />
    <app-despesa-table [contas]="lista()" (marcarPago)="marcarComoPago($event)" />
  </section>
</section>
