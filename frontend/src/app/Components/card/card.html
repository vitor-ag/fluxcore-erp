<article
  [class]="'panel card tone-' + dados().tom"
  [class.card--destaque]="dados().destaque"
>
  <div class="card__topo">
    <span class="card__titulo">{{ dados().titulo }}</span>

    @if (dados().icone) {
      <span class="card__icone" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          @switch (dados().icone) {
            @case ('saldo') {
              <rect x="3" y="6" width="18" height="14" rx="2" />
              <path d="M3 10h18" />
              <circle cx="16.5" cy="14.5" r="1" />
            }
            @case ('receber') {
              <path d="M12 4v10" />
              <path d="m8 10 4 4 4-4" />
              <path d="M5 20h14" />
            }
            @case ('pagar') {
              <path d="M12 14V4" />
              <path d="m8 8 4-4 4 4" />
              <path d="M5 20h14" />
            }
            @case ('previsao') {
              <path d="M3 3v18h18" />
              <path d="m7 15 4-4 3 3 5-6" />
            }
            @case ('avista') {
              <circle cx="12" cy="12" r="9" />
              <path d="M14.5 9.2c-.4-.7-1.3-1.2-2.5-1.2-1.4 0-2.5.8-2.5 1.8 0 2.4 5 1.2 5 3.6 0 1-1.1 1.8-2.5 1.8-1.2 0-2.1-.5-2.5-1.2" />
              <path d="M12 6.5V8M12 16v1.5" />
            }
            @case ('parcelado') {
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 10h18" />
              <path d="M7 15h3" />
            }
            @case ('servico') {
              <rect x="3" y="7" width="18" height="13" rx="2" />
              <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
              <path d="M3 13h18" />
            }
            @case ('alerta') {
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            }
          }
        </svg>
      </span>
    }
  </div>

  <strong
    class="card__valor"
    [class.card__valor--escuro]="dados().valorEscuro"
    [attr.title]="dados().valorExato ?? null"
  >{{ dados().valor }}</strong>

  @if (dados().valorExato) {
    <span class="card__dica">Passe o mouse para valor exato</span>
  }
  @if (dados().subtitulo) {
    <span class="card__dica">{{ dados().subtitulo }}</span>
  }

  @if (dados().variacao) {
    <div class="card__variacao">
      <span class="card__delta" [class.ruim]="!dados().variacaoBoa">
        {{ dados().direcao === 'up' ? '↑' : '↓' }} {{ dados().variacao }}
      </span>
      <span>{{ dados().comparacao }}</span>
    </div>
  }
</article>
