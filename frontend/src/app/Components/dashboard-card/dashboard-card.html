<article [class]="'panel card tone-' + dados().tom">
  <div class="card__topo">
    <span class="card__titulo">{{ dados().titulo }}</span>

    <span class="card__icone" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        @switch (dados().icone) {
          @case ('saldo') {
            <rect x="3" y="6" width="18" height="14" rx="2" />
            <path d="M3 10h18" />
            <circle cx="16.5" cy="14.5" r="1" />
          }
          @case ('receber') {
            <path d="M12 4v10" />
            <path d="m8 10 4 4 4-4" />
            <path d="M5 20h14" />
          }
          @case ('pagar') {
            <path d="M12 14V4" />
            <path d="m8 8 4-4 4 4" />
            <path d="M5 20h14" />
          }
          @case ('previsao') {
            <path d="M3 3v18h18" />
            <path d="m7 15 4-4 3 3 5-6" />
          }
        }
      </svg>
    </span>
  </div>

  <strong class="card__valor" [title]="dados().valorExato">{{ dados().valor }}</strong>
  <span class="card__dica">Passe o mouse para valor exato</span>

  <div class="card__variacao">
    <span class="card__delta" [class.ruim]="!dados().variacaoBoa">
      {{ dados().direcao === 'up' ? '↑' : '↓' }} {{ dados().variacao }}
    </span>
    <span>{{ dados().comparacao }}</span>
  </div>
</article>
