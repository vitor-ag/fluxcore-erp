services:
  mysql:
    image: mysql:8.0
    container_name: fluxcore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fluxcore_db}
      MYSQL_USER: ${MYSQL_USER:-fluxcore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fluxcore}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fluxcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxcore-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fluxcore_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-fluxcore}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-fluxcore}
    ports:
      - "8080:8080"
    networks:
      - fluxcore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fluxcore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - fluxcore-network

volumes:
  mysql_data:

networks:
  fluxcore-network:
    driver: bridge
